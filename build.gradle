plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}-mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	flatDir {
		def libDirs = [file("libs")]
		if (file("libs").exists()) {
			file("libs").eachDirRecurse { libDirs << it }
		}
		dirs libDirs.unique()
	}
	maven { url "https://SILENCE-SIMSOOL.github.io/maven-repo/" }
	maven { url = uri("https://api.modrinth.com/maven") }
	maven { url = uri("https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1") }
	maven { url "https://repo.papermc.io/repository/maven-public/" }
	maven { url = "https://maven.bawnorton.com/releases" }
}

loom {
	accessWidenerPath = file("src/main/resources/lucentclient.accesswidener")
	mods {
		"lucentclient" {
			sourceSet sourceSets.main
		}
	}

	runConfigs.named("client") {
		ideConfigGenerated = true
		property "devauth.enabled", "true"
		property "devauth.account", "main"
	}

	runConfigs.named("server") {
		ideConfigGenerated = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	runtimeOnly("me.djtheredstoner:DevAuth-fabric:${property("devauth_version")}")
 
	implementation "io.github.humbleui:skija-shared:${project.skija_version}"
	include "io.github.humbleui:skija-shared:${project.skija_version}"
	implementation "io.github.humbleui:types:${project.types_version}"
	include "io.github.humbleui:types:${project.types_version}"

	def lucentVersion = "${project.lucent_version}-${project.minecraft_version}-${project.lucent_library}"
	implementation "com.github.SILENCE-SIMSOOL:lucent:${lucentVersion}"
	include "com.github.SILENCE-SIMSOOL:lucent:${lucentVersion}"

	implementation ("com.velocitypowered:velocity-native:3.4.0-SNAPSHOT")
	include ("com.velocitypowered:velocity-native:3.4.0-SNAPSHOT")

	implementation "com.lmax:disruptor:4.0.0"
	include "com.lmax:disruptor:4.0.0"

	include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.3")))

	fileTree(dir: 'libs', include: ['**/*.jar']).each { file ->
		def baseName = file.name.take(file.name.lastIndexOf('.'))
		def matcher = (baseName =~ /^(.+?)-(\d.*)$/)
		if (matcher.matches()) {
			def modName = matcher[0][1]
			def modVer = matcher[0][2]
			implementation name: modName, version: modVer
			include name: modName, version: modVer
		} else {
			implementation name: baseName
			include name: baseName
		}
	}
}

def particleShaderResources = layout.buildDirectory.dir('generated/particleShaders')
def compileSpirv = tasks.register('compileSpirv', JavaExec) {
	def compilerSource = file('gradle/CompileParticleShader.java')
	def shaderSource = file('src/main/resources/assets/asyncparticles/particle_gpu_acceleration/vk_particle_compute.comp')
	def shaderOutput = particleShaderResources.map { it.file('assets/asyncparticles/particle_gpu_acceleration/vk_particle_compute.spv') }
	inputs.files(compilerSource, shaderSource)
	outputs.dir(particleShaderResources)
	classpath = configurations.runtimeClasspath
	mainClass = compilerSource.absolutePath
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(25)
	}
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	args shaderSource.absolutePath, shaderOutput.get().asFile.absolutePath
}

processResources {
	from(compileSpirv)
	inputs.property "version", project.mod_version

	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version
	}
	
}

tasks.named('processResources') {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName
	exclude "**/*.java"
}

task remapPluginJar(type: Jar) {
	dependsOn jar
	archiveClassifier = 'lite'
	manifest.from jar.manifest
	from({ zipTree(jar.archiveFile) }) {
		exclude 'META-INF/MANIFEST.MF'
		exclude 'META-INF/jars/**'
	}
}

assemble.dependsOn remapPluginJar

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java

			artifact(remapPluginJar) {
				classifier = "lite"
			}
		}
	}
}
