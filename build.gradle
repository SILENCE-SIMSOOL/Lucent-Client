plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = "${project.mod_version}-mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	mavenCentral()
	flatDir {
		def libDirs = [file("libs")]
		if (file("libs").exists()) {
			file("libs").eachDirRecurse { libDirs << it }
		}
		dirs libDirs.unique()
	}
	maven { url "https://SILENCE-SIMSOOL.github.io/maven-repo/" }
	maven { url = uri("https://api.modrinth.com/maven") }
	maven { url = uri("https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1") }
	maven { url "https://repo.papermc.io/repository/maven-public/" }
	maven { url = "https://maven.bawnorton.com/releases" }
}

loom {
	accessWidenerPath = file("src/main/resources/lucentclient.accesswidener")

	mods {
		"lucentclient" {
			sourceSet sourceSets.main
		}
	}

	runConfigs.named("client") {
		ideConfigGenerated = true
		property "devauth.enabled", "true"
		property "devauth.account", "main"
	}

	runConfigs.named("server") {
		ideConfigGenerated = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modRuntimeOnly("me.djtheredstoner:DevAuth-fabric:${property("devauth_version")}")
 
	def lwjglVersion = project.property("minecraft_lwjgl_version")
	modImplementation "org.lwjgl:lwjgl-nanovg:${lwjglVersion}"
	include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}"
	["windows", "linux", "macos", "macos-arm64"].each { os ->
		modImplementation "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-${os}"
		include "org.lwjgl:lwjgl-nanovg:${lwjglVersion}:natives-${os}"
	}

	def lucentVersion = "${project.lucent_version}-mc${project.minecraft_version}"
	modImplementation "silence.simsool.lucent:lucent:${lucentVersion}:library"
	include "silence.simsool.lucent:lucent:${lucentVersion}:library"

	modImplementation ("com.velocitypowered:velocity-native:3.4.0-SNAPSHOT")
	include ("com.velocitypowered:velocity-native:3.4.0-SNAPSHOT")

	implementation "com.lmax:disruptor:4.0.0"
	include "com.lmax:disruptor:4.0.0"

	include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.3")))

	fileTree(dir: 'libs', include: ['**/*.jar']).each { file ->
		def baseName = file.name.take(file.name.lastIndexOf('.'))
		def matcher = (baseName =~ /^(.+?)-(\d.*)$/)
		if (matcher.matches()) {
			def modName = matcher[0][1]
			def modVer = matcher[0][2]
			modImplementation name: modName, version: modVer
			include name: modName, version: modVer
		} else {
			modImplementation name: baseName
			include name: baseName
		}
	}
}

processResources {
	inputs.property "version", project.mod_version

	filesMatching("fabric.mod.json") {
		expand "version": project.mod_version
	}
	
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName
	exclude "**/*.java"
}

task remapPluginJar(type: net.fabricmc.loom.task.RemapJarTask) {
	dependsOn jar
	input = jar.archiveFile
	archiveClassifier = 'lite'
	addNestedDependencies = false
}

remapJar {
	archiveClassifier = ''
	addNestedDependencies = true
}

assemble.dependsOn remapPluginJar

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java

			artifact(remapPluginJar) {
				classifier = "lite"
			}
		}
	}
}